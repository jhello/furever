<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c2410c">
  <meta name="description" content="毛孩子 FurEver - 记录毛孩子的每一天">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script>
    (function () {
      var inset = 0;
      try {
        if (window.AndroidBars && typeof window.AndroidBars.getTopInsetDp === 'function') {
          var value = window.AndroidBars.getTopInsetDp();
          if (typeof value === 'number' && isFinite(value) && value > 0) inset = value;
        }
      } catch (error) {
        inset = 0;
      }
      document.documentElement.style.setProperty('--status-h', inset + 'px');
    })();
  </script>
  <title>毛孩子 FurEver</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="fv-toast" role="status" aria-live="polite"></div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
